<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Upscaler</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1b1b1a; --muted: #6b6b66;
    --line: #dddcd6; --accent: #2f6fdb; --accent-text: #ffffff; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --panel: #1f1f1e; --text: #ecebe6; --muted: #9a9993;
            --line: #33332f; --accent: #5b8ff0; --accent-text: #0d0d0d; --error: #ef6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--panel);
          padding: 40px 16px; text-align: center; color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  .status { min-height: 24px; margin: 12px 0; color: var(--muted); }
  .status.err { color: var(--error); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  figcaption { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 6px; image-rendering: auto; }
  .compare { position: relative; overflow: hidden; border-radius: 6px; }
  .compare img { image-rendering: pixelated; }
  .compare .after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--split, 50%)); }
  .compare .after img { image-rendering: auto; }
  input[type=range] { width: 100%; }
  a.dl { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Image Upscaler</h1>
  <p class="sub">Real-ESRGAN, running locally. Drop an image, pick a model, upscale.</p>

  <div class="controls">
    <label>Model
      <select id="model">
        <option value="photo-x4">Photo (Real-ESRGAN x4)</option>
        <option value="photo-x2">Photo (Real-ESRGAN x2)</option>
        <option value="anime-x4">Anime / illustration (x4)</option>
      </select>
    </label>
    <label>Output scale
      <select id="scale">
        <option>2</option><option>3</option><option selected>4</option>
      </select>
    </label>
    <button id="go" class="primary" disabled>Upscale</button>
  </div>

  <div id="drop">Drop image here or click to choose<br><small>PNG, JPG, WebP</small></div>
  <input id="file" type="file" accept="image/*" hidden>
  <div id="status" class="status"></div>

  <div id="result" class="grid" hidden>
    <figure>
      <figcaption><span>Compare (drag slider)</span><span id="sizes"></span></figcaption>
      <div class="compare" id="compare">
        <img id="before" alt="Original">
        <div class="after"><img id="after" alt="Upscaled"></div>
      </div>
      <input id="split" type="range" min="0" max="100" value="50" aria-label="Comparison split">
    </figure>
    <figure>
      <figcaption><span>Upscaled</span><a id="dl" class="dl" download>Download PNG</a></figcaption>
      <img id="full" alt="Upscaled result">
    </figure>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let file = null;

fetch("/api/info").then(r => r.json()).then(i => {
  $("status").textContent = `Ready · running on ${i.device.toUpperCase()}`;
});

$("model").onchange = () => { if ($("model").value === "photo-x2") $("scale").value = "2"; };
$("drop").onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files[0]);
["dragover", "dragenter"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
$("split").oninput = e => $("compare").style.setProperty("--split", e.target.value + "%");

function pick(f) {
  if (!f || !f.type.startsWith("image/")) return;
  file = f;
  $("drop").textContent = `${f.name} · ${(f.size / 1024).toFixed(0)} KB`;
  $("go").disabled = false;
}

$("go").onclick = async () => {
  const fd = new FormData();
  fd.append("image", file);
  fd.append("model", $("model").value);
  fd.append("scale", $("scale").value);
  $("go").disabled = true;
  $("status").className = "status";
  const t0 = performance.now();
  const tick = setInterval(() => $("status").textContent =
    `Upscaling… ${((performance.now() - t0) / 1000).toFixed(0)}s (first run downloads the model)`, 500);
  try {
    const r = await fetch("/api/upscale", { method: "POST", body: fd });
    if (!r.ok) {
      const html = await r.text();
      throw new Error(html.match(/<p>(.*?)<\/p>/s)?.[1] || r.statusText);
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const before = URL.createObjectURL(file);
    $("before").src = before; $("after").src = url; $("full").src = url;
    $("dl").href = url;
    $("dl").download = (r.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)/)?.[1] || "upscaled.png";
    await $("full").decode();
    const o = new Image(); o.src = before; await o.decode();
    $("sizes").textContent = `${o.naturalWidth}×${o.naturalHeight} → ${$("full").naturalWidth}×${$("full").naturalHeight}`;
    $("result").hidden = false;
    $("status").textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  } catch (e) {
    $("status").className = "status err";
    $("status").textContent = "Error: " + e.message;
  } finally {
    clearInterval(tick);
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
