<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Upscaler</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1b1b1a; --muted: #6b6b66;
    --line: #dddcd6; --accent: #2f6fdb; --accent-text: #ffffff; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --panel: #1f1f1e; --text: #ecebe6; --muted: #9a9993;
            --line: #33332f; --accent: #5b8ff0; --accent-text: #0d0d0d; --error: #ef6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--panel);
          padding: 40px 16px; text-align: center; color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  .status { min-height: 24px; margin: 12px 0; color: var(--muted); }
  .status.err { color: var(--error); }
  progress { width: 100%; max-width: 480px; height: 8px; accent-color: var(--accent); display: block; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  figcaption { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 6px; image-rendering: auto; }
  .compare { position: relative; overflow: hidden; border-radius: 6px; }
  .compare img { image-rendering: pixelated; }
  .compare .after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--split, 50%)); }
  .compare .after img { image-rendering: auto; }
  input[type=range] { width: 100%; }
  .controls input[type=range] { width: 140px; }
  input[type=color] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  label.check { display: flex; align-items: center; gap: 6px; padding-bottom: 9px; color: var(--text); }
  .checker { background-color: #fff;
    background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
  a.dl { color: var(--accent); }
  .linkish { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
  .batch-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.name { word-break: break-all; }
  td.state { color: var(--muted); white-space: nowrap; }
  td.state.ok { color: var(--text); }
  td.state.err { color: var(--error); }
  tr:last-child td { border-bottom: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Image Upscaler</h1>
  <p class="sub">Real-ESRGAN, running locally. Drop an image, pick a model, upscale. Optionally remove the background for print.</p>

  <div class="controls">
    <label>Model
      <select id="model">
        <option value="photo-x4">Photo (Real-ESRGAN x4)</option>
        <option value="photo-x2">Photo (Real-ESRGAN x2)</option>
        <option value="anime-x4">Anime / illustration (x4)</option>
      </select>
    </label>
    <label>Output scale
      <select id="scale">
        <option value="1">1 (no upscale)</option>
        <option>2</option><option>3</option><option selected>4</option>
      </select>
    </label>
    <label>Background
      <select id="bg">
        <option value="none">Keep</option>
        <option value="ai">Remove (AI)</option>
        <option value="color">Remove colour</option>
      </select>
    </label>
    <label class="colour-opt" hidden>Colour
      <input id="bgColor" type="color" value="#ffffff">
    </label>
    <label class="colour-opt" hidden>Tolerance <span id="tolVal">10</span>
      <input id="tol" type="range" min="0" max="60" value="10">
    </label>
    <label class="check colour-opt" hidden>
      <input id="edges" type="checkbox" checked> Only from edges
    </label>
    <button id="go" class="primary" disabled>Upscale</button>
    <button id="stop" hidden>Stop after this image</button>
  </div>

  <div id="drop">Drop images or a folder here, or click to choose files<br><small>PNG, JPG, WebP</small></div>
  <p class="sub" style="margin:8px 0 0"><button id="pickFolder" class="linkish">Choose a whole folder</button></p>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="folder" type="file" webkitdirectory hidden>
  <div id="status" class="status"></div>
  <progress id="bar" max="1" value="0" hidden></progress>

  <div id="result" class="grid" hidden>
    <figure>
      <figcaption><span>Compare (drag slider)</span><span id="sizes"></span></figcaption>
      <div class="compare checker" id="compare">
        <img id="before" alt="Original">
        <div class="after checker"><img id="after" alt="Upscaled"></div>
      </div>
      <input id="split" type="range" min="0" max="100" value="50" aria-label="Comparison split">
    </figure>
    <figure>
      <figcaption><span>Upscaled</span><a id="dl" class="dl" download>Download PNG</a></figcaption>
      <div class="checker" style="border-radius:6px"><img id="full" alt="Upscaled result"></div>
    </figure>
  </div>

  <div id="batch" hidden>
    <div class="batch-head">
      <strong id="batchSummary"></strong>
      <button id="zip" class="primary" disabled>Download all (ZIP)</button>
    </div>
    <table>
      <thead><tr><th>File</th><th>Size</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const IMAGE_EXT = /\.(png|jpe?g|webp|bmp|tiff?|gif)$/i;
let files = [];      // [{file, path}]
let stopRequested = false;

fetch("/api/info").then(r => r.json()).then(i => {
  $("status").textContent = `Ready · running on ${i.device.toUpperCase()}`;
});

$("model").onchange = () => { if ($("model").value === "photo-x2") $("scale").value = "2"; };
$("bg").onchange = () => document.querySelectorAll(".colour-opt")
  .forEach(el => el.hidden = $("bg").value !== "color");
$("tol").oninput = () => $("tolVal").textContent = $("tol").value;
$("drop").onclick = () => $("file").click();
$("pickFolder").onclick = () => $("folder").click();
$("file").onchange = e => pick([...e.target.files].map(f => ({ file: f, path: f.name })));
$("folder").onchange = e => pick([...e.target.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name })));
["dragover", "dragenter"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", async e => {
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  pick(entries.length ? await readEntries(entries) : [...e.dataTransfer.files].map(f => ({ file: f, path: f.name })));
});
$("split").oninput = e => $("compare").style.setProperty("--split", e.target.value + "%");
$("stop").onclick = () => { stopRequested = true; $("stop").disabled = true; };

// Walk dropped folders recursively.
async function readEntries(entries) {
  const out = [];
  async function walk(entry) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ file, path: entry.fullPath.replace(/^\//, "") });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const child of batch) await walk(child);
      } while (batch.length);
    }
  }
  for (const entry of entries) await walk(entry);
  return out;
}

function fmt(s) {
  return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
}

function kb(bytes) {
  return bytes > 1e6 ? `${(bytes / 1e6).toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
}

function pick(list) {
  list = list.filter(f => f.file.type.startsWith("image/") || IMAGE_EXT.test(f.file.name))
             .filter(f => !f.file.name.startsWith("."))
             .sort((a, b) => a.path.localeCompare(b.path));
  if (!list.length) return;
  files = list;
  const total = list.reduce((n, f) => n + f.file.size, 0);
  $("drop").textContent = list.length === 1
    ? `${list[0].path} · ${kb(total)}`
    : `${list.length} images · ${kb(total)}`;
  $("go").textContent = list.length === 1 ? "Upscale" : `Upscale ${list.length} images`;
  $("go").disabled = false;
  $("result").hidden = true;
  $("batch").hidden = true;
}

function settings() {
  return {
    model: $("model").value, scale: $("scale").value, bg: $("bg").value,
    bg_color: $("bgColor").value, tolerance: $("tol").value,
    edges_only: $("edges").checked ? "1" : "0",
  };
}

// Upscale one file, reporting progress via onStatus(text, done, total).
async function runOne(file, opts, onStatus) {
  const fd = new FormData();
  fd.append("image", file);
  for (const [k, v] of Object.entries(opts)) fd.append(k, v);
  const job = Math.random().toString(36).slice(2);
  fd.append("job", job);
  const t0 = performance.now();
  let running = true;
  const tick = setInterval(async () => {
    const secs = ((performance.now() - t0) / 1000).toFixed(0);
    let p = {};
    try { p = await (await fetch(`/api/progress/${job}`)).json(); } catch {}
    if (!running) return;
    if (p.total) {
      onStatus(`${Math.round(100 * p.done / p.total)}% · tile ${p.done}/${p.total} · ~${fmt(p.eta)} left`, p.done, p.total);
    } else {
      const stage = { "loading model": "Loading model (first run downloads it)",
                      "removing background": "Removing background" }[p.stage] || "Starting";
      onStatus(`${stage}… ${secs}s`);
    }
  }, 1000);
  try {
    const r = await fetch("/api/upscale", { method: "POST", body: fd });
    if (!r.ok) {
      const html = await r.text();
      throw new Error(html.match(/<p>(.*?)<\/p>/s)?.[1] || r.statusText);
    }
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)/)?.[1] || "upscaled.png";
    return { blob: await r.blob(), name, secs: (performance.now() - t0) / 1000 };
  } finally {
    running = false;
    clearInterval(tick);
  }
}

function setBar(done, total) {
  if (total) { $("bar").max = total; $("bar").value = done; } else $("bar").removeAttribute("value");
}

$("go").onclick = () => files.length === 1 ? runSingle(files[0].file) : runBatch(files);

async function runSingle(file) {
  $("go").disabled = true;
  $("status").className = "status";
  $("bar").hidden = false; setBar();
  try {
    const res = await runOne(file, settings(), (text, d, n) => {
      $("status").textContent = `Upscaling… ${text}`; setBar(d, n);
    });
    const url = URL.createObjectURL(res.blob);
    const before = URL.createObjectURL(file);
    $("before").src = before; $("after").src = url; $("full").src = url;
    $("dl").href = url;
    $("dl").download = res.name;
    await $("full").decode();
    const o = new Image(); o.src = before; await o.decode();
    $("sizes").textContent = `${o.naturalWidth}×${o.naturalHeight} → ${$("full").naturalWidth}×${$("full").naturalHeight}`;
    $("result").hidden = false;
    $("status").textContent = `Done in ${res.secs.toFixed(1)}s`;
  } catch (e) {
    $("status").className = "status err";
    $("status").textContent = "Error: " + e.message;
  } finally {
    $("bar").hidden = true;
    $("go").disabled = false;
  }
}

async function runBatch(list) {
  const opts = settings();
  const results = [];
  stopRequested = false;
  $("go").disabled = true;
  $("stop").hidden = false; $("stop").disabled = false;
  $("zip").disabled = true;
  $("result").hidden = true;
  $("batch").hidden = false;
  $("status").className = "status";
  $("bar").hidden = false;
  $("rows").innerHTML = "";
  const rows = list.map(({ file, path }) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="name"></td><td>${kb(file.size)}</td><td class="state">Waiting</td><td></td>`;
    tr.cells[0].textContent = path;
    $("rows").appendChild(tr);
    return tr;
  });
  const t0 = performance.now();
  let ok = 0, failed = 0;
  for (let i = 0; i < list.length; i++) {
    if (stopRequested) break;
    const { file, path } = list[i];
    const state = rows[i].cells[2];
    state.textContent = "Working…";
    setBar();
    rows[i].scrollIntoView({ block: "nearest" });
    try {
      const res = await runOne(file, opts, (text, d, n) => {
        state.textContent = text;
        $("status").textContent = `Image ${i + 1} of ${list.length} · ${text}`;
        setBar(d, n);
      });
      const dir = path.includes("/") ? path.slice(0, path.lastIndexOf("/") + 1) : "";
      results.push({ path: dir + res.name, blob: res.blob });
      state.textContent = `Done · ${res.secs.toFixed(1)}s · ${kb(res.blob.size)}`;
      state.className = "state ok";
      const a = document.createElement("a");
      a.className = "dl"; a.textContent = "Download";
      a.href = URL.createObjectURL(res.blob); a.download = res.name;
      rows[i].cells[3].appendChild(a);
      ok++;
    } catch (e) {
      state.textContent = "Error: " + e.message;
      state.className = "state err";
      failed++;
    }
    $("batchSummary").textContent = `${ok} done${failed ? ` · ${failed} failed` : ""} · ${list.length - ok - failed} left`;
  }
  for (const tr of rows) if (tr.cells[2].textContent === "Waiting") tr.cells[2].textContent = "Skipped";
  const secs = Math.round((performance.now() - t0) / 1000);
  $("status").textContent = `${stopRequested ? "Stopped" : "Finished"} · ${ok} of ${list.length} images in ${fmt(secs)}`;
  $("batchSummary").textContent = `${ok} done${failed ? ` · ${failed} failed` : ""}`;
  $("bar").hidden = true;
  $("stop").hidden = true;
  $("go").disabled = false;
  if (results.length) {
    $("zip").disabled = false;
    $("zip").onclick = async () => {
      const bytes = results.reduce((n, r) => n + r.blob.size, 0);
      if (bytes > 4e9) {
        $("status").textContent = "Too big for one ZIP (over 4 GB). Use the per-file Download links.";
        return;
      }
      $("zip").disabled = true;
      $("zip").textContent = "Building ZIP…";
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(await makeZip(results));
        a.download = `upscaled_${results.length}_images.zip`;
        a.click();
      } finally {
        $("zip").disabled = false;
        $("zip").textContent = "Download all (ZIP)";
      }
    };
  }
}

// Minimal ZIP writer (store only; PNGs are already compressed).
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function makeZip(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const { path, blob } of entries) {
    const data = new Uint8Array(await blob.arrayBuffer());
    const name = enc.encode(path);
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);          // UTF-8 names
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    parts.push(local, name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}
</script>
</body>
</html>
